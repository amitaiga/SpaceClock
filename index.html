<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שעון החלל</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #5ef2ff;
    --violet: #b06bff;
    --pink: #ff5ec8;
    --text: #e8f4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #02010a;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
  }

  /* ---------- background layers ---------- */
  #space { position: fixed; inset: 0; z-index: 0; display: block; }

  .nebula {
    position: fixed; inset: -20%;
    z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 40% 30% at 20% 30%, rgba(176,107,255,.35), transparent 70%),
      radial-gradient(ellipse 35% 40% at 80% 70%, rgba(94,242,255,.22), transparent 70%),
      radial-gradient(ellipse 30% 25% at 65% 20%, rgba(255,94,200,.25), transparent 70%),
      radial-gradient(ellipse 50% 35% at 35% 85%, rgba(60,80,255,.25), transparent 70%);
    filter: blur(30px);
    mix-blend-mode: screen;
    animation: drift 60s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: rotate(0deg) scale(1); }
    to   { transform: rotate(12deg) scale(1.15); }
  }

  /* planet with rings */
  .planet-wrap {
    position: fixed;
    width: 42vmin; height: 42vmin;
    left: 6vw; bottom: -8vmin;
    z-index: 1; pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-2.5vmin); }
  }
  .planet {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 35%),
      repeating-linear-gradient(-20deg, rgba(255,255,255,.06) 0 6%, transparent 6% 12%),
      radial-gradient(circle at 35% 35%, #ff9a6b, #b0408f 50%, #2a0c4a 80%);
    box-shadow:
      inset -4vmin -3vmin 6vmin rgba(0,0,0,.75),
      0 0 6vmin rgba(255,110,180,.45),
      0 0 14vmin rgba(176,107,255,.3);
  }
  .ring {
    position: absolute;
    left: -35%; top: 38%;
    width: 170%; height: 24%;
    border-radius: 50%;
    border: 1.4vmin solid rgba(255,200,240,.35);
    box-shadow: 0 0 3vmin rgba(255,180,230,.35), inset 0 0 2vmin rgba(255,180,230,.3);
    transform: rotate(-18deg);
  }
  .ring.back  { z-index: -1; clip-path: inset(0 0 50% 0); }
  .ring.front { z-index: 2;  clip-path: inset(50% 0 0 0); }

  /* small moon orbiting */
  .moon-orbit {
    position: fixed;
    right: 10vw; top: 12vh;
    width: 22vmin; height: 22vmin;
    z-index: 1; pointer-events: none;
    animation: spin 30s linear infinite;
  }
  .moon {
    position: absolute; top: 0; left: 50%;
    width: 4vmin; height: 4vmin; margin-left: -2vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #9fb6d8 45%, #3b4a6b 85%);
    box-shadow: 0 0 2vmin rgba(180,210,255,.6);
  }
  .moon-orbit::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px dashed rgba(94,242,255,.18);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- clock ---------- */
  main {
    position: relative; z-index: 3;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3vmin;
    padding: 16px;
  }
  .dial {
    position: relative;
    width: min(78vmin, 560px);
    aspect-ratio: 1;
    display: grid; place-items: center;
  }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .glass {
    position: absolute; inset: 9%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(94,242,255,.08), rgba(10,8,30,.55) 70%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(94,242,255,.18);
    box-shadow: 0 0 60px rgba(94,242,255,.12), inset 0 0 50px rgba(176,107,255,.15);
  }
  .readout {
    position: relative;
    direction: ltr;
    text-align: center;
    font-family: 'Orbitron', monospace;
  }
  .time {
    font-size: clamp(2.6rem, 13vmin, 6.5rem);
    font-weight: 900;
    letter-spacing: .04em;
    background: linear-gradient(180deg, #ffffff 10%, var(--cyan) 60%, var(--violet));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(94,242,255,.55));
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .seconds {
    margin-top: 1.6vmin;
    font-size: clamp(1.4rem, 6vmin, 3rem);
    font-weight: 700;
    color: var(--pink);
    text-shadow: 0 0 14px rgba(255,94,200,.8);
    font-variant-numeric: tabular-nums;
  }
  .seconds small {
    font-size: .45em; letter-spacing: .3em;
    color: rgba(232,244,255,.55); text-shadow: none;
    margin-left: .4em; vertical-align: middle;
  }
  .date {
    font-size: clamp(.95rem, 3vmin, 1.35rem);
    font-weight: 300;
    letter-spacing: .05em;
    color: rgba(232,244,255,.8);
    text-shadow: 0 0 10px rgba(94,242,255,.4);
    text-align: center;
  }
  .tz {
    font-family: 'Orbitron', monospace;
    font-size: .75rem;
    letter-spacing: .35em;
    color: rgba(94,242,255,.55);
    direction: ltr;
  }
  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center; z-index: 3;
    font-size: .8rem; color: rgba(232,244,255,.35);
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula, .planet-wrap, .moon-orbit, .colon { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="nebula"></div>

  <div class="moon-orbit"><div class="moon"></div></div>
  <div class="planet-wrap">
    <div class="ring back"></div>
    <div class="planet"></div>
    <div class="ring front"></div>
  </div>

  <main>
    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#5ef2ff"/>
            <stop offset="50%" stop-color="#b06bff"/>
            <stop offset="100%" stop-color="#ff5ec8"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="ticks"></g>
        <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(94,242,255,.08)" stroke-width="3"/>
        <circle id="arc" cx="100" cy="100" r="94" fill="none"
                stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round"
                transform="rotate(-90 100 100)" filter="url(#glow)"/>
        <circle id="comet" r="3.4" fill="#fff" filter="url(#glow)"/>
      </svg>
      <div class="glass"></div>
      <div class="readout">
        <div class="time" id="time">00<span class="colon">:</span>00</div>
        <div class="seconds"><span id="sec">00</span><small>SEC</small></div>
      </div>
    </div>
    <div class="date" id="date"></div>
    <div class="tz" id="tz"></div>
  </main>
  <div class="hint">לחצו על המסך למסע במהירות האור ✦</div>

<script>
(() => {
  /* ===== Clock ===== */
  const timeEl = document.getElementById('time');
  const secEl  = document.getElementById('sec');
  const dateEl = document.getElementById('date');
  const tzEl   = document.getElementById('tz');
  const arc    = document.getElementById('arc');
  const comet  = document.getElementById('comet');
  const ticks  = document.getElementById('ticks');
  const R = 94, C = 2 * Math.PI * R;
  arc.style.strokeDasharray = C;

  // 60 tick marks around the dial
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2 - Math.PI / 2;
    const major = i % 5 === 0;
    const r1 = major ? 82 : 85, r2 = 88;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 100 + r1 * Math.cos(a));
    l.setAttribute('y1', 100 + r1 * Math.sin(a));
    l.setAttribute('x2', 100 + r2 * Math.cos(a));
    l.setAttribute('y2', 100 + r2 * Math.sin(a));
    l.setAttribute('stroke', major ? 'rgba(94,242,255,.75)' : 'rgba(232,244,255,.25)');
    l.setAttribute('stroke-width', major ? 1.4 : .6);
    l.dataset.i = i;
    ticks.appendChild(l);
  }
  const tickEls = ticks.children;

  const pad = n => String(n).padStart(2, '0');
  const dateFmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  tzEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.toUpperCase();

  let lastSec = -1;
  function tickClock() {
    const now = new Date();
    const s = now.getSeconds();
    const frac = (s + now.getMilliseconds() / 1000) / 60;

    // smooth sweeping arc + comet head
    arc.style.strokeDashoffset = C * (1 - frac);
    const a = frac * Math.PI * 2 - Math.PI / 2;
    comet.setAttribute('cx', 100 + R * Math.cos(a));
    comet.setAttribute('cy', 100 + R * Math.sin(a));

    if (s !== lastSec) {
      lastSec = s;
      timeEl.innerHTML = `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}`;
      secEl.textContent = pad(s);
      dateEl.textContent = dateFmt.format(now);
      for (let i = 0; i < 60; i++) {
        tickEls[i].style.opacity = i <= s ? 1 : .35;
      }
    }
  }

  /* ===== Starfield (3D warp) ===== */
  const cvs = document.getElementById('space');
  const ctx = cvs.getContext('2d');
  let W, H, cx, cy, DPR;
  const STARS = 900;
  const stars = [];
  const palette = ['#ffffff', '#cfe9ff', '#9fdcff', '#ffd9f2', '#e4d4ff'];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.width = innerWidth * DPR;
    H = cvs.height = innerHeight * DPR;
    cvs.style.width = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
    cx = W / 2; cy = H / 2;
  }
  function makeStar(s = {}) {
    s.x = (Math.random() - .5) * W * 2;
    s.y = (Math.random() - .5) * H * 2;
    s.z = Math.random() * W;
    s.pz = s.z;
    s.c = palette[(Math.random() * palette.length) | 0];
    return s;
  }
  resize();
  for (let i = 0; i < STARS; i++) stars.push(makeStar());
  addEventListener('resize', resize);

  // shooting stars
  const meteors = [];
  function spawnMeteor() {
    meteors.push({
      x: Math.random() * W, y: Math.random() * H * .4,
      vx: -(6 + Math.random() * 6) * DPR, vy: (3 + Math.random() * 3) * DPR,
      life: 1
    });
  }

  let speed = 2, targetSpeed = 2;
  addEventListener('pointerdown', () => targetSpeed = 45);
  addEventListener('pointerup',   () => targetSpeed = 2);
  addEventListener('pointercancel', () => targetSpeed = 2);

  // gentle mouse parallax
  let mx = 0, my = 0;
  addEventListener('pointermove', e => {
    mx = (e.clientX / innerWidth - .5);
    my = (e.clientY / innerHeight - .5);
  });

  function frame() {
    speed += (targetSpeed - speed) * .06;
    const warp = Math.min(1, (speed - 2) / 40);
    ctx.fillStyle = `rgba(2,1,10,${0.45 - warp * 0.3})`;
    ctx.fillRect(0, 0, W, H);

    const ox = cx - mx * 60 * DPR, oy = cy - my * 60 * DPR;
    for (const s of stars) {
      s.pz = s.z;
      s.z -= speed * DPR;
      if (s.z < 1) { makeStar(s); s.z = W; s.pz = s.z; continue; }
      const k = 128 * DPR / s.z, pk = 128 * DPR / s.pz;
      const x = ox + s.x * k / DPR * .5, y = oy + s.y * k / DPR * .5;
      const px = ox + s.x * pk / DPR * .5, py = oy + s.y * pk / DPR * .5;
      if (x < 0 || x > W || y < 0 || y > H) { makeStar(s); s.z = W; s.pz = s.z; continue; }
      const size = Math.max(.4, (1 - s.z / W) * 2.6 * DPR);
      const alpha = Math.min(1, (1 - s.z / W) * 1.4);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = s.c;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(x + .1, y + .1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (Math.random() < .012) spawnMeteor();
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= .012;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 14, m.y - m.vy * 14);
      g.addColorStop(0, `rgba(255,255,255,${m.life})`);
      g.addColorStop(1, 'rgba(94,242,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 2 * DPR;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 14, m.y - m.vy * 14);
      ctx.stroke();
      if (m.life <= 0) meteors.splice(i, 1);
    }

    tickClock();
    requestAnimationFrame(frame);
  }
  tickClock();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
